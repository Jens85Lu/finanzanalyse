[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finanzanalyse"
version = "0.1.0"
description = "Analyse von Girokontodaten mit Python, pandas und SQLite"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "matplotlib",
    "streamlit>=1.65.0",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "fints>=5.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
